<!doctype html>
<html lang="ru" suppressHydrationWarning>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#CFCEC6" />
    <title>{% block title %}Postbox — тихая переписка{% endblock %}</title>
    <script>
      try {
        var saved = localStorage.getItem("postbox-theme") || "system";
        var dark = saved === "dark" || (saved === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="stylesheet" href="/static/css/app.css" />
    <link rel="stylesheet" href="/static/css/pages.css" />
  </head>
  <body>
    {% block body %}
    <header class="site-header">
      <a class="site-header__brand" href="/">Postbox</a>
      {% if user is defined and user %}
      <nav class="site-header__nav">
        <span class="site-header__user">{{ user.first_name }}</span>
        <form method="post" action="/logout" class="site-header__logout">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
          <button class="ghost-button ghost-button--sm" type="submit">Выйти</button>
        </form>
      </nav>
      {% endif %}
    </header>
    <main class="main-content">
      <div class="page">{% block content %}{% endblock %}</div>
    </main>
    {% endblock %}
  </body>
</html>
